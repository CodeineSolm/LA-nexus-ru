<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost Ark Nexus Ru</title>
    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/type-container.css" />
  </head>
  <body>
    <!-- Warriors -->
    <div class="type-container">
      <div class="type-title">Воины</div>
      <div class="class-cards">
        <!--Berserker-->
        <div class="class-card">
          <div class="class-title">Берсерк</div>
          <img
            class="class-bg-img"
            src="images/warriors/berserker/BG_Berserker.png"
          />
          <img
            class="class-img"
            src="images/warriors/berserker/Warrior_Berserker.png"
          />
        </div>

        <!--Destroyer-->
        <div class="class-card">
          <div class="class-title">Сокрушитель</div>
          <img
            class="class-bg-img"
            src="images/warriors/destroyer/BG_Destroyer.png"
          />
          <img
            class="class-img"
            src="images/warriors/destroyer/Warrior_Destroyer.png"
          />
        </div>

        <!--Gunlancer-->
        <div class="class-card">
          <div class="class-title">Страж</div>
          <img
            class="class-bg-img"
            src="images/warriors/gunlancer/BG_Gunlancer.png"
          />
          <img
            class="class-img"
            src="images/warriors/gunlancer/Warrior_Gunlancer.png"
          />
        </div>

        <!--Paladin-->
        <div class="class-card">
          <div class="class-title">Паладин</div>
          <img
            class="class-bg-img"
            src="images/warriors/paladin/BG_Paladin.png"
          />
          <img
            class="class-img"
            src="images/warriors/paladin/Warrior_Paladin.png"
          />
        </div>

        <!--Slayer-->
        <div class="class-card">
          <div class="class-title">Валькирия</div>
          <img
            class="class-bg-img"
            src="images/warriors/slayer/BG_Slayer.png"
          />
          <img
            class="class-img"
            src="images/warriors/slayer/Warrior_Slayer.png"
          />
        </div>

        <!--Valkyrie-->
        <div class="class-card">
          <div class="class-title">Храмовница</div>
          <img
            class="class-bg-img"
            src="images/warriors/valkyrie/BG_Valkyrie.png"
          />
          <img
            class="class-img"
            src="images/warriors/valkyrie/Warrior_Valkyrie.png"
          />
        </div>
      </div>
    </div>

    <!-- Mages -->
    <div class="type-container">
      <div class="type-title">Маги</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Аркана</div>
          <img
            class="class-bg-img"
            src="images/mages/arcanist/BG_Arcanist.png"
          />
          <img class="class-img" src="images/mages/arcanist/Mage_Arcana.png" />
        </div>
      </div>
    </div>

    <!-- Fighters -->
    <div class="type-container">
      <div class="type-title">Монахи</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Стальной Кулак</div>
          <img
            class="class-bg-img"
            src="images/fighters/breaker/BG_Breaker.png"
          />
          <img
            class="class-img"
            src="images/fighters/breaker/Fighter_Breaker.png"
          />
        </div>
      </div>
    </div>

    <!-- Gunners -->
    <div class="type-container">
      <div class="type-title">Стрелки</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Механист</div>
          <img
            class="class-bg-img"
            src="images/gunners/artillerist/BG_Artillerist.png"
          />
          <img
            class="class-img"
            src="images/gunners/artillerist/Gunner_Artillerist.png"
          />
        </div>
      </div>
    </div>

    <!-- Assassins -->
    <div class="type-container">
      <div class="type-title">Ассасины</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Фурия</div>
          <img
            class="class-bg-img"
            src="images/assassins/shadowhunter/BG_Shadowhunter.png"
          />
          <img
            class="class-img"
            src="images/assassins/shadowhunter/Assassin_Shadowhunter.png"
          />
        </div>
      </div>
    </div>

    <!-- Specialists -->
    <div class="type-container">
      <div class="type-title">Творцы</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Друид</div>
          <img
            class="class-bg-img"
            src="images/specialists/wildsoul/BG_Wildsoul.png"
          />
          <img
            class="class-img"
            src="images/specialists/wildsoul/Specialist_Wildsoul.png"
          />
        </div>
      </div>
    </div>

    <!-- Guardian Knights -->
    <div class="type-container">
      <div class="type-title">Рыцари-Хранители</div>
      <div class="class-cards">
        <div class="class-card">
          <div class="class-title">Рыцарь-Хранитель</div>
          <img
            class="class-bg-img"
            src="images/guardian knights/guardian knight/BG_GK.webp"
          />
        </div>
      </div>
    </div>
  </body>
</html>
